name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      # Referenced by tag. A tag is mutable, so whoever controls the action
      # repository controls what runs here.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned to a full commit SHA, which is what the other two should look
      # like. Kept here on purpose as the clean counterexample.
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm run typecheck
