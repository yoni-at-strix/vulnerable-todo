<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 20px; }
    form { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type=text] { flex: 1; padding: 8px 10px; }
    button { padding: 8px 14px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; }
    li.done span { text-decoration: line-through; opacity: 0.55; }
    li span { flex: 1; }
    a { font-size: 13px; }
  </style>
</head>
<body>
  <h1>Todo</h1>
  <form id="add">
    <input type="text" id="title" placeholder="What needs doing?" required>
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>
  <p><a href="/share">Open the shareable view</a></p>

  <script type="module">
    const list = document.getElementById("list");

    async function load() {
      const todos = await (await fetch("/api/todos")).json();
      list.innerHTML = "";
      for (const todo of todos) {
        const li = document.createElement("li");
        li.className = todo.done ? "done" : "";
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = todo.done;
        box.onchange = () => patch(todo.id, { done: box.checked });
        const label = document.createElement("span");
        label.textContent = todo.title;
        const del = document.createElement("button");
        del.textContent = "Delete";
        del.onclick = () => remove(todo.id);
        li.append(box, label, del);
        list.append(li);
      }
    }

    async function patch(id, body) {
      await fetch(`/api/todos/${id}`, {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body),
      });
      load();
    }

    async function remove(id) {
      await fetch(`/api/todos/${id}`, { method: "DELETE" });
      load();
    }

    document.getElementById("add").onsubmit = async (event) => {
      event.preventDefault();
      const input = document.getElementById("title");
      await fetch("/api/todos", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ title: input.value }),
      });
      input.value = "";
      load();
    };

    load();
  </script>
</body>
</html>
